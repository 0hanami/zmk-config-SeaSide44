# キーボード名の設定
CONFIG_ZMK_KEYBOARD_NAME="SeaSide44"

# Bluetooth接続の安定化・レスポンス向上
# 送信出力を最大に
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y
# 接続間隔を7.5msに固定（MIN=MAX で一貫した間隔を確保）
CONFIG_BT_PERIPHERAL_PREF_MIN_INT=6
CONFIG_BT_PERIPHERAL_PREF_MAX_INT=6
# スレーブレイテンシ0: 毎回の接続イベントで応答（ポインティングデバイスに必須）
CONFIG_BT_PERIPHERAL_PREF_LATENCY=0
# 監視タイムアウト 4秒
CONFIG_BT_PERIPHERAL_PREF_TIMEOUT=400
# BLE送信バッファ増加（マウスレポートの欠落防止）
CONFIG_BT_BUF_ACL_TX_COUNT=10
CONFIG_BT_BUF_EVT_RX_COUNT=20
CONFIG_BT_CONN_TX_MAX=10
CONFIG_BT_L2CAP_TX_BUF_COUNT=10
# マウス機能を有効化
CONFIG_ZMK_MOUSE=y
# NFC ピンを GPIO として使用
CONFIG_NFCT_PINS_AS_GPIOS=y
# BLE（Bluetooth Low Energy）を有効化
CONFIG_ZMK_BLE=y
# SPI（シリアル通信）を有効化
CONFIG_SPI=y
# 入力デバイスのサポートを有効化
CONFIG_INPUT=y
# PMW3610 トラックボールセンサーを有効化
CONFIG_INPUT_PMW3610=y
# バッテリー残量の報告を有効化
CONFIG_ZMK_BATTERY_REPORTING=y
# BLE スプリットキーボードのバッテリー情報を中央側で管理
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y
# BLE スプリットキーボードのバッテリー情報を取得
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y
# ZMK Studio（Web カスタマイズツール）を有効化
CONFIG_ZMK_STUDIO=y
# ZMK Studio のキーロック機能を無効化
CONFIG_ZMK_STUDIO_LOCKING=n

# 電源オン時のLEDインジケータの有効/無効
CONFIG_RGBLED_WIDGET=y 
# バッテリー残量が40%未満の時黄色、20%未満の時赤色表示
CONFIG_RGBLED_WIDGET_BATTERY_LEVEL_HIGH=40    
CONFIG_RGBLED_WIDGET_BATTERY_LEVEL_CRITICAL=20 

# レイヤー切り替え時のLEDインジケータの有効/無効
CONFIG_RGBLED_WIDGET_SHOW_LAYER_COLORS=y

# レイヤーごとの色設定（0=オフ, 1=赤, 2=緑, 3=黄, 4=青, 5=マゼンタ, 6=シアン, 7=白
# オートマウスレイヤーだけ青色に光り、それ以外のレイヤーはオフに設定
CONFIG_RGBLED_WIDGET_LAYER_0_COLOR=0
CONFIG_RGBLED_WIDGET_LAYER_1_COLOR=0
CONFIG_RGBLED_WIDGET_LAYER_2_COLOR=0
CONFIG_RGBLED_WIDGET_LAYER_3_COLOR=0
CONFIG_RGBLED_WIDGET_LAYER_4_COLOR=4
CONFIG_RGBLED_WIDGET_LAYER_5_COLOR=0
CONFIG_RGBLED_WIDGET_LAYER_6_COLOR=0
CONFIG_RGBLED_WIDGET_LAYER_7_COLOR=0

