<!DOCTYPE html>
<html>
<head><title>Icon Generator</title></head>
<body>
<canvas id="c48" width="48" height="48"></canvas>
<canvas id="c128" width="128" height="128"></canvas>
<script>
function draw(canvas, size) {
  const ctx = canvas.getContext('2d');
  ctx.fillStyle = '#6366f1';
  ctx.beginPath();
  ctx.roundRect(0, 0, size, size, size/6);
  ctx.fill();
  ctx.fillStyle = 'white';
  ctx.font = `bold ${size/2}px Arial`;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText('JA', size/2, size/2);
}
draw(document.getElementById('c48'), 48);
draw(document.getElementById('c128'), 128);
// Right-click to save as PNG
</script>
<p>Right-click each canvas and "Save Image As" to create icon48.png and icon128.png</p>
</body>
</html>
